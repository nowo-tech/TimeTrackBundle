# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md|\.github/workflows/.*)$' # TEMP pilot measurement only: reverted before merge
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo_sqlite, intl
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          SYMFONY_MAJOR="${SYMFONY%%.*}"
          if [ "$SYMFONY_MAJOR" -ge 8 ]; then
            DOCTRINE_BUNDLE="^3.0"
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          echo "Using doctrine/doctrine-bundle ${DOCTRINE_BUNDLE} with Symfony ^${SYMFONY}"
          composer require \
            symfony/config:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            doctrine/doctrine-bundle:${DOCTRINE_BUNDLE} \
            --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        if: env.HEAVY == 'true' && (matrix.php == '8.2' && matrix.symfony == '7.4')
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  functional-databases:
    # Since 1.13: the whole functional suite (old and new tests) also runs on MySQL 8 and PostgreSQL 16.
    # Since 1.23.0: each database also with `database.private_entity_manager: true` (the tests that assume one shared
    # entity manager, group `shared-entity-manager`, are left out of those runs).
    name: Functional suite - ${{ matrix.database }}${{ matrix.private == '1' && ' - private entity manager' || '' }}${{ matrix.mapping == 'xml' && ' - XML mapping' || '' }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MySQL 8.0
            private: '0'
            image: mysql:8.0
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=8.0.32&charset=utf8mb4
          - database: MariaDB 10.6
            private: '0'
            image: mariadb:10.6
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=10.6.0-MariaDB&charset=utf8mb4
          # Since 1.24.1 (REQ-SEC-006): the look-alike id tests also on the current LTS servers.
          - database: MySQL 8.4
            private: '0'
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=8.4.0&charset=utf8mb4
          - database: MariaDB 11.4
            private: '0'
            image: mariadb:11.4
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          - database: PostgreSQL 16
            private: '0'
            image: postgres:16-alpine
            port: 5432
            health: pg_isready -U postgres -d tt
            url: postgresql://postgres:pg@127.0.0.1:5432/tt?serverVersion=16&charset=utf8
          - database: MySQL 8.0
            private: '1'
            image: mysql:8.0
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=8.0.32&charset=utf8mb4
          - database: MariaDB 10.6
            private: '1'
            image: mariadb:10.6
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=10.6.0-MariaDB&charset=utf8mb4
          - database: PostgreSQL 16
            private: '1'
            image: postgres:16-alpine
            port: 5432
            health: pg_isready -U postgres -d tt
            url: postgresql://postgres:pg@127.0.0.1:5432/tt?serverVersion=16&charset=utf8
          # Since 1.23.0: the shipped XML mapping (REQ-ARCH-001 rule 2) with the private entity manager.
          - database: MySQL 8.0
            private: '1'
            mapping: xml
            image: mysql:8.0
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
            url: mysql://root:root@127.0.0.1:3306/tt?serverVersion=8.0.32&charset=utf8mb4
          - database: PostgreSQL 16
            private: '1'
            mapping: xml
            image: postgres:16-alpine
            port: 5432
            health: pg_isready -U postgres -d tt
            url: postgresql://postgres:pg@127.0.0.1:5432/tt?serverVersion=16&charset=utf8

    services:
      database:
        image: ${{ needs.changes.outputs.mode != 'light' && matrix.image || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tt
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: tt
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no run for this cell
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the functional suite
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
          TIME_TRACK_TEST_DATABASE_URL: ${{ matrix.url }}
          TIME_TRACK_TEST_PRIVATE_ENTITY_MANAGER: ${{ matrix.private }}
          TIME_TRACK_TEST_MAPPING_TYPE: ${{ matrix.mapping }}
        run: php -d memory_limit=1G vendor/bin/phpunit --testsuite functional --no-coverage ${{ matrix.private == '1' && '--exclude-group shared-entity-manager' || '' }}

  functional-private-entity-manager:
    # Since 1.23.0: the whole functional suite on SQLite with `database.private_entity_manager: true`, and with the
    # shipped XML mapping (REQ-ARCH-001 rules 2 and 6).
    name: Functional suite - SQLite - ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: private entity manager
            private: '1'
            mapping: ''
          - variant: XML mapping
            private: '0'
            mapping: xml

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no run for this cell
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the functional suite
        if: env.HEAVY == 'true'
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
          TIME_TRACK_TEST_PRIVATE_ENTITY_MANAGER: ${{ matrix.private }}
          TIME_TRACK_TEST_MAPPING_TYPE: ${{ matrix.mapping }}
        run: php -d memory_limit=1G vendor/bin/phpunit --testsuite functional --no-coverage ${{ matrix.private == '1' && '--exclude-group shared-entity-manager' || '' }}

  # 1.27.0 (Beacon spec 239): lock waits and concurrent processes on real servers (tests/Database, run with
  # fail-on-skipped), then the deterministic race replays and the runner tests on the same server, with doctrine/dbal 4
  # and 3. Passwordless services.
  load-readiness:
    name: Load readiness (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    # Never skipped at job level: a skipped matrix job reports its un-expanded name and the required contexts would never appear.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root@127.0.0.1:3306/tt?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres@127.0.0.1:5432/tt?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/tt?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/tt?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
          # 1.31.0 (REQ-RUNTIME-003): MariaDB 11.x next to MySQL 8.4 and PostgreSQL 16.
          - { name: 'MariaDB 11.4', url: 'mysql://root@127.0.0.1:3307/tt?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/tt?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tt
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: tt
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no run for this cell
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."
      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Use DBAL 3
        if: env.HEAVY == 'true' && (matrix.dbal != '')
        run: composer require --no-interaction --no-progress --with-all-dependencies "doctrine/dbal:${{ matrix.dbal }}"

      - name: Lock wait and multi-process tests
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        env:
          TIME_TRACK_TEST_DATABASE_URL: ${{ matrix.url }}
        run: php -d memory_limit=1G vendor/bin/phpunit --no-coverage --fail-on-skipped --testsuite database

      - name: Identity / access-key column collations (REQ-SEC-006)
        if: env.HEAVY == 'true'
        env:
          TIME_TRACK_TEST_DATABASE_URL: ${{ matrix.url }}
        run: php -d memory_limit=1G vendor/bin/phpunit --no-coverage --testsuite collation

      - name: Race replays and the transaction runner on the real server
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        env:
          TIME_TRACK_TEST_DATABASE_URL: ${{ matrix.url }}
        run: >-
          php -d memory_limit=1G vendor/bin/phpunit --no-coverage
          --filter 'LoadReadiness|AuditQo|TransactionRunner|TimeTrackRows|ImportedEntriesTest|EntriesIdempotencyRaceTest|BalanceLedgerChainTest|HostTimerApiDatabaseTest|DeviceFlowTest|HostFlushProbe'
          tests/Functional

      - name: The same with the private entity manager
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        env:
          TIME_TRACK_TEST_DATABASE_URL: ${{ matrix.url }}
          TIME_TRACK_TEST_PRIVATE_ENTITY_MANAGER: '1'
        run: >-
          php -d memory_limit=1G vendor/bin/phpunit --no-coverage --exclude-group shared-entity-manager
          --filter 'LoadReadiness|AuditQo|TransactionRunner|TimeTrackRows|ImportedEntriesTest|EntriesIdempotencyRaceTest|BalanceLedgerChainTest|HostTimerApiDatabaseTest|DeviceFlowTest|HostFlushProbe'
          tests/Functional

  rollback-clients:
    # Since 1.15 (audit HA-H2): the reference SQL through sqlite3, mysql, mariadb and psql, with their default options.
    name: Rollback scripts with the native clients
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the scripts
        run: .scripts/check-rollback-clients.sh

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- src tests .php-cs-fixer.dist.php demo)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src tests .php-cs-fixer.dist.php demo
          git diff --staged --quiet || git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, intl
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/form:^7.4 symfony/framework-bundle:^7.4 symfony/http-foundation:^7.4 symfony/http-kernel:^7.4 symfony/routing:^7.4 symfony/twig-bundle:^7.4 symfony/web-profiler-bundle:^7.4 doctrine/doctrine-bundle:^2.10 --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage (fails below 100%, REQ-TEST-003)
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage-100
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, intl
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer phpstan

  security-audit:
    name: Composer audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer audit

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, accepted by branch protection).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, intl
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/time-track-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo_sqlite, intl
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
