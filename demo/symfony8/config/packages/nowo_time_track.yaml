nowo_time_track:
    user_class: App\Entity\User
    task_provider: nowo_task_board.task_provider
    team_context_provider: nowo_task_board.team_context_provider
    clients:
        enabled: true
    client_api:
        # Exact extension origins only (chrome-extension://<id>, moz-extension://<uuid>); the desktop app sends none.
        allowed_origins: []
        # Device flow of the desktop app; the bundle's default verification page is /tools/time-track/device.
        device_flow:
            enabled: true
    client_distribution:
        extension:
            chrome: 'https://github.com/nowo-tech/time-track-extension/releases/latest'
        desktop:
            linux: 'https://github.com/nowo-tech/time-track-desktop/releases/latest'
            windows: 'https://github.com/nowo-tech/time-track-desktop/releases/latest'
            macos: 'https://github.com/nowo-tech/time-track-desktop/releases/latest'
    # TimeTrack 1.13 showcase (/timesheet): one tenant scope, the hours balance from the working hours, task time as the
    # worked time (not a legal register). The demo user cannot approve their own timesheet (nobody can).
    timesheets:
        enabled: true
        scope_mode: single
        approver_provider: App\Timesheet\DemoApproverProvider
    working_time:
        enabled: true
    # TimeTrack 1.14 showcase: GET /api/time-track/me/meetings from a fake provider (no real calendar; the token needs the
    # meetings:read scope), and POST /api/time-track/entries (manual entries, entries:write scope).
    meetings:
        enabled: true
        provider: App\Meeting\DemoMeetingProvider
    manual_entries:
        enabled: true
