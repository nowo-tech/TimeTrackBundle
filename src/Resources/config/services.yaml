# Bundle service definitions.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TimeTrackBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../TimeTrackBundle.php'
            # Bridge defaults are registered by TimeTrackExtension only when selected (task_provider /
            # team_context_provider); the scan must not overwrite those explicit definitions.
            - '../../Bridge/'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Client/ClientLoginRateLimiter.php'
            - '../../Client/ClientResponseFactory.php'
            - '../../Client/DefaultClientAuthenticator.php'
            - '../../Service/TeamAccessGuard.php'
            - '../../Security/TimeTrackAccessCheckerInterface.php'
            - '../../Security/ConfigurableTimeTrackAccessChecker.php'
            - '../../Security/AllowAllTimeTrackAccessChecker.php'

    Nowo\TimeTrackBundle\Controller\:
        resource: '../../Controller/'
        public: true

    Nowo\TimeTrackBundle\Routing\TimeTrackRouteLoader:
        arguments:
            $clientsEnabled: '%nowo_time_track.clients.enabled%'
            $clientRoutes: '%nowo_time_track.clients.routes%'
            $manageRoutes: '%nowo_time_track.routes%'
            $routePrefix: '%nowo_time_track.route_prefix%'
        tags:
            - { name: routing.loader }

    Nowo\TimeTrackBundle\Service\ClientAuthService:
        arguments:
            $tokenTtlSeconds: '%nowo_time_track.clients.token_ttl%'
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Controller\TimeTrackClientApiController:
        public: true
        arguments:
            $idleThresholdSeconds: '%nowo_time_track.clients.idle_threshold_seconds%'
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Command\PurgeExpiredClientTokensCommand:
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Controller\TimeTrackManageController:
        public: true
        arguments:
            $templates: '%nowo_time_track.templates%'
            $allowUnauthenticated: '%nowo_time_track.security.allow_unauthenticated%'
            $reportsPageSize: '%nowo_time_track.reports.page_size%'

    # REQ-OBS-001: services that log use the `time_track` Monolog channel when MonologBundle is installed (the tag is
    # ignored otherwise and the default `logger`, or none, is injected).
    Nowo\TimeTrackBundle\Service\TimerService:
        tags:
            - { name: monolog.logger, channel: time_track }
