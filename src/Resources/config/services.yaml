# Bundle service definitions.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\TimeTrackBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../TimeTrackBundle.php'
            # Bridge defaults are registered by TimeTrackExtension only when selected (task_provider /
            # team_context_provider); the scan must not overwrite those explicit definitions.
            - '../../Bridge/'
            - '../../Repository/'
            - '../../Doctrine/'
            - '../../Client/ClientLoginRateLimiter.php'
            - '../../Client/ClientResponseFactory.php'
            - '../../Client/DefaultClientAuthenticator.php'
            - '../../Client/ClientApiRateLimiter.php'
            - '../../Client/ClientApiAuditor.php'
            - '../../Client/ConfigClientApiSettingsProvider.php'
            - '../../Client/ConfigClientDistributionProvider.php'
            - '../../Client/ClientApiSettings.php'
            - '../../Client/ClientDistribution.php'
            - '../../Client/ClientApiPrincipal.php'
            - '../../Client/IdleCheckSettings.php'
            - '../../Client/ClientIdempotencyStore.php'
            - '../../Client/ClientWorkingTimeContext.php'
            - '../../Workday/'
            - '../../Service/DeviceAuthorizationService.php'
            - '../../Entity/'
            - '../../Enum/'
            - '../../Event/'
            - '../../Exception/'
            - '../../Dto/'
            - '../../Service/TeamAccessGuard.php'
            # Since 1.11: value objects and the writer / policy (the writer and the policy are defined by the extension).
            - '../../Import/ImportedTimeEntryData.php'
            - '../../Import/ImportedTimeEntryPerson.php'
            - '../../Import/ImportedTimeEntryClaim.php'
            - '../../Import/ImportedTimeEntryMoveResult.php'
            - '../../Import/ImportedTimeEntryResult.php'
            - '../../Import/ImportedTimeEntryBatchResult.php'
            - '../../Import/ImportedTimeEntryRemoval.php'
            - '../../Import/ImportedTimeEntryScope.php'
            - '../../Import/ImportedTimeEntryOutcome.php'
            - '../../Import/ImportedDescriptionSanitizer.php'
            - '../../Import/InvalidImportedTimeEntryException.php'
            - '../../Import/ImportedEntryOwnerMismatchException.php'
            - '../../Import/ImportedTimeEntryWriter.php'
            - '../../Retention/'
            - '../../Security/TimeTrackAccessCheckerInterface.php'
            - '../../Security/ConfigurableTimeTrackAccessChecker.php'
            - '../../Security/AllowAllTimeTrackAccessChecker.php'
            # Since 1.13: timesheets and working time are defined by the extension (value objects excluded too).
            - '../../Timesheet/'
            # Since 1.17: the task time mover is defined by the extension (value objects excluded too).
            - '../../TaskMove/'
            - '../../Support/CanonicalJson.php'
            - '../../Support/StorageTime.php'
            # Since 1.13: working time — value objects; the services are defined by the extension.
            - '../../WorkingTime/'
            # Since 1.14: calendar suggestions are defined by the extension (value objects excluded too).
            - '../../Calendar/'
            # Since 1.14: the meetings API services are defined by the extension (value objects excluded too).
            - '../../Meeting/'

    Nowo\TimeTrackBundle\Controller\:
        resource: '../../Controller/'
        public: true

    Nowo\TimeTrackBundle\Routing\TimeTrackRouteLoader:
        arguments:
            $clientsEnabled: '%nowo_time_track.clients.enabled%'
            $deviceFlowEnabled: '%nowo_time_track.client_api.device_flow.enabled%'
            $deviceDefaultPage: '%nowo_time_track.client_api.device_flow.default_page%'
            $clientRoutes: '%nowo_time_track.clients.routes%'
            $manageRoutes: '%nowo_time_track.routes%'
            $routePrefix: '%nowo_time_track.route_prefix%'
        tags:
            - { name: routing.loader }

    Nowo\TimeTrackBundle\Service\ClientAuthService:
        arguments:
            $tokenTtlSeconds: '%nowo_time_track.clients.token_ttl%'
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Controller\TimeTrackClientApiController:
        public: true
        arguments:
            $idleThresholdSeconds: '%nowo_time_track.clients.idle_threshold_seconds%'
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Command\PurgeExpiredClientTokensCommand:
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Command\BackfillEntryScopeCommand:
        tags:
            - { name: monolog.logger, channel: time_track }

    Nowo\TimeTrackBundle\Controller\TimeTrackManageController:
        public: true
        arguments:
            $templates: '%nowo_time_track.templates%'
            $allowUnauthenticated: '%nowo_time_track.security.allow_unauthenticated%'
            $reportsPageSize: '%nowo_time_track.reports.page_size%'

    # REQ-UI-003: view models + layout of the manage pages.
    Nowo\TimeTrackBundle\Ui\TimeTrackPages:
        arguments:
            $layoutTemplate: '%nowo_time_track.web_ui.layout_template%'
            $twig: '@?twig'

    # REQ-OBS-001: services that log use the `time_track` Monolog channel when MonologBundle is installed (the tag is
    # ignored otherwise and the default `logger`, or none, is injected).
    Nowo\TimeTrackBundle\Service\TimerService:
        tags:
            - { name: monolog.logger, channel: time_track }

    # 1.9 host entry point: revoke every session token of a deleted credential (public for host controllers/listeners).
    Nowo\TimeTrackBundle\Client\ClientTokenRevoker:
        public: true
